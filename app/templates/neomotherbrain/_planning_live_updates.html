<script nonce="{{ csp_nonce() }}" data-planning-live-collaboration>
(() => {
    const root = document.querySelector("[data-planning-live-root]");
    if (!root || root.dataset.planningLiveBound === "true") {
        return;
    }
    root.dataset.planningLiveBound = "true";

    const stateUrl = root.dataset.stateUrl;
    let currentRevision = root.dataset.planningRevision || "";
    const statusElement = root.querySelector("[data-live-update-status]");
    const initialStatus = {{ live_update_status|tojson }};
    let controller = null;

    const reconcile = (payload) => {
        const fragments = payload.fragments || {};
        window.NeoLiveUpdates.reconcileRows(
            root.querySelector("[data-live-rows='review']"),
            fragments.review || ""
        );
        window.NeoLiveUpdates.reconcileRows(
            root.querySelector("[data-live-rows='missions']"),
            fragments.missions || ""
        );
        let prepareMobileRow;
        if (Array.isArray(payload.tail_options)) {
            const choices = document.createDocumentFragment();
            for (const tail of payload.tail_options) choices.append(new Option(tail, tail));
            root.querySelector("#tail-swap-options")?.replaceChildren(choices.cloneNode(true));
            prepareMobileRow = row => row.querySelector("select[name='replacement_tail']")?.append(choices.cloneNode(true));
        }
        window.NeoLiveUpdates.reconcileRows(
            root.querySelector("[data-live-rows='mobile-missions']"),
            fragments.mobile_missions || "", prepareMobileRow
        );
        window.NeoLiveUpdates.reconcileAlertTrays(fragments.alert_tray);
    };

    const loadState = async () => {
        const pollUrl = new URL(stateUrl, window.location.href);
        pollUrl.searchParams.set("revision", currentRevision);
        pollUrl.searchParams.set("compact_tail_options", "1");
        const response = await fetch(pollUrl, {
            cache: "no-store",
            credentials: "same-origin",
            headers: {"Accept": "application/json"},
        });
        if (!response.ok) {
            throw new Error("Planning live refresh failed.");
        }
        const payload = await response.json();
        if (!payload.ok) {
            throw new Error(payload.error || "Planning live refresh failed.");
        }
        controller.setServerStatus(payload.refresh || {});
        currentRevision = payload.revision || currentRevision;
        if (payload.changed === false) {
            return;
        }
        reconcile(payload);
    };

    let pendingRead = null;
    const poll = () => {
        if (!pendingRead) pendingRead = loadState().finally(() => { pendingRead = null; });
        return pendingRead;
    };
    const readAfterAction = async () => {
        // A read started before the commit can still carry the old revision.
        if (pendingRead) await pendingRead.catch(() => {});
        return poll();
    };

    controller = window.NeoLiveUpdates.create({
        intervalMs: {{ live_update_status.live_screen_refresh_interval_ms }},
        statusElement,
        poll,
    });
    window.NeoLiveUpdates.bindConflictSafeForms(root, readAfterAction);
    controller.setServerStatus(initialStatus);
})();
</script>
