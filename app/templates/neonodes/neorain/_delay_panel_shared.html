<link rel="stylesheet" href="{{ url_for('static', filename='css/neorain_csp_delay_panel_shared.css', v='20261031-csp-v1') }}">
<script defer src="{{ url_for('static', filename='js/neorain_delay_info.js', v=config.STATIC_ASSET_VERSION) }}"></script>
<script nonce="{{ csp_nonce() }}">
(() => {
    const initDelayPanels = () => {
        const root = document.querySelector("[data-neorain-inbound-live], [data-neorain-outbound-live]");
        if (!root || root.dataset.neorainDelayPanelsReady === "true") return;
        root.dataset.neorainDelayPanelsReady = "true";

        const storageKey = "neorain:desktop-delay-ui:" + window.location.pathname;
        const readStored = () => {
            try {
                const value = JSON.parse(sessionStorage.getItem(storageKey) || "[]");
                return Array.isArray(value) ? value.map(String) : [];
            } catch (_) {
                return [];
            }
        };
        const writeStored = () => {
            if (window.matchMedia("(max-width: 760px)").matches) return;
            try {
                const ids = Array.from(root.querySelectorAll("[data-neorain-delay-panel]"))
                    .filter((panel) => panel.hidden === false)
                    .map((panel) => panel.id);
                sessionStorage.setItem(storageKey, JSON.stringify(ids));
            } catch (_) {}
        };
        const setOpen = (panel, open, { persist = true } = {}) => {
            if (!panel) return;
            panel.hidden = !open;
            const button = root.querySelector('[data-neorain-delay-toggle][aria-controls="' + panel.id + '"]');
            button?.setAttribute("aria-expanded", open ? "true" : "false");
            if (persist) writeStored();
        };

        root.addEventListener("click", (event) => {
            const button = event.target.closest("[data-neorain-delay-toggle]");
            if (!button || !root.contains(button)) return;
            const panel = document.getElementById(button.getAttribute("aria-controls"));
            if (!panel || !root.contains(panel)) return;
            setOpen(panel, panel.hidden);
        });

        if (!window.matchMedia("(max-width: 760px)").matches) {
            readStored().forEach((id) => {
                const panel = document.getElementById(id);
                if (panel && root.contains(panel)) setOpen(panel, true, { persist: false });
            });
            writeStored();
        }

        const openHashPanel = () => {
            if (window.matchMedia("(max-width: 760px)").matches) return;
            const id = window.location.hash.slice(1);
            if (!id || !id.startsWith("delay-info-")) return;
            const panel = document.getElementById(id);
            if (!panel || !root.contains(panel)) return;
            setOpen(panel, true);
            window.requestAnimationFrame(() => panel.scrollIntoView({ block: "nearest" }));
        };
        window.addEventListener("hashchange", openHashPanel);
        openHashPanel();
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initDelayPanels, { once: true });
    else initDelayPanels();
})();
</script>
