<style>
.rain-override {display:flex; align-items:center; justify-content:center; gap:2px; min-width:0; position:relative; font:inherit; line-height:1.2;}
.rain-override [hidden] {display:none!important;}
.rain-override [data-rain-override-readout] {white-space:nowrap; font-variant-numeric:tabular-nums;}
.rain-override button {display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; box-sizing:border-box; width:20px; height:22px; min-height:0; border:1px solid rgba(var(--node-rgb),.4); background:#101722; color:var(--node-highlight); border-radius:3px; padding:0; font:inherit; line-height:1; cursor:pointer;}
.rain-override button:focus-visible {outline:2px solid var(--node-highlight); outline-offset:1px;}
.rain-override [data-rain-override-editor] {position:absolute; top:100%; left:0; z-index:30; display:flex; align-items:center; gap:3px; width:max-content; padding:3px; border:1px solid rgba(var(--node-rgb),.4); border-radius:3px; background:#101722; box-shadow:0 3px 8px #0008;}
.rain-override input[type=text] {box-sizing:border-box; width:58px; min-width:0; height:24px; padding:2px 3px; margin:0; background:#101722; color:#fff; border:1px solid var(--node-highlight); font:inherit;}
.rain-override input[type=checkbox] {width:15px; height:15px; margin:0; accent-color:var(--node-highlight);}
/* Save announcements remain accessible without adding a source/status row. */
.rain-override output {position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap;}
.rain-override.is-error output {position:absolute; top:100%; left:0; z-index:31; width:max-content; max-width:160px; height:auto; margin:0; padding:3px; clip-path:none; white-space:normal; overflow-wrap:anywhere; background:#101722; color:#f2a3aa; font-size:.6rem;}
.rain-override.is-error:has([data-rain-override-editor]:not([hidden])) output {top:calc(100% + 34px);}
body.blueprint-neorain .neorain-desktop-board .neorain-outbound-table tbody > tr:not(.neorain-delay-panel-row) > td {padding-top:5px; padding-bottom:5px;}
@media (max-width:1440px) {body.blueprint-neorain .neorain-mobile-mission-grid > .neorain-mobile-mission-open {min-height:40px; padding:4px 2px;} body.blueprint-neorain .neorain-mobile-mission-grid > div:first-child .neorain-mobile-mission-open {min-height:22px; padding-block:2px;}}
@media (max-width:900px) {.rain-override {font-size:.6rem;} .rain-override button {width:16px; height:22px;}}
</style>
