{% extends "base.html" %}
{% block title %}Command center | NeoRaiden{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/neoraiden.css', v=config.STATIC_ASSET_VERSION) }}">
<section class="raiden" data-raiden data-revision="{{ revision }}" data-state="{{ url_for('neoraiden.state', gateway=gateway.code, operation_id=selected_id) }}">
    <header class="raiden-header"><div><p>NeoRaiden</p><h1>Operations command center</h1></div>
        <div class="raiden-actions">
            <button type="button" data-refresh>Refresh</button>
            <details><summary aria-label="Refresh settings" title="Refresh settings">⚙</summary>
                <label>Refresh interval <select data-interval>{% for n in (15,30,60,120,300) %}<option value="{{ n }}"{% if n == 30 %} selected{% endif %}>{{ n }} seconds</option>{% endfor %}</select></label>
            </details>
        </div>
    </header>
    <div class="raiden-toolbar">
        <form method="get"><label>Gateway <select name="gateway" data-submit-on-change>{% for g in gateways %}<option value="{{ g.code }}"{% if g.id == gateway.id %} selected{% endif %}>{{ g.code }}</option>{% endfor %}</select></label></form>
        <form method="get"><input type="hidden" name="gateway" value="{{ gateway.code }}"><label>Sort <select data-sort-choice><option value="{{ url_for('neoraiden.index',gateway=gateway.code) }}">Current Sort</option>{% for s in sorts %}<option value="{{ url_for('neoraiden.index',gateway=gateway.code,operation_id=s.id) }}"{% if s.id == selected_id %} selected{% endif %}>{{ s.sort_date }} · {{ s.sort_name|title }}</option>{% endfor %}</select></label></form>
        <span>Updated <time data-success></time> · <span data-countdown></span></span>
    </div>
    <p class="raiden-stale" role="status" data-stale hidden></p>
    <div data-board>{% include "neonodes/neoraiden/_board.html" %}</div>
</section>
<script defer src="{{ url_for('static', filename='js/neoraiden.js', v=config.STATIC_ASSET_VERSION) }}"></script>
{% endblock %}
