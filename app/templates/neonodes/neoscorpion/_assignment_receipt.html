{% for sent in receipts if sent.resource_id is not none %}<span data-assignment-resource="{{ sent.kind }}:{{ sent.resource_id }}">{{ 'Fueler' if sent.kind == 'fueler' else 'Truck' }} {{ sent.name }} · <time{% if sent.utc %} datetime="{{ sent.utc }}" title="{{ sent.source }} · {{ sent.utc }}"{% else %} title="Assignment time unavailable; no reliable historical evidence"{% endif %}>ASSIGNED {{ sent.display }}</time></span>{% endfor %}
