{% for fueler in nightly_assignment_fuelers %}<option value="{{ fueler.id }}" data-nightly-fueler-option{% if fueler.id == selected_fueler_id|default(none) %} selected{% endif %}{% if fueler.id in nightly_on_break_fueler_ids %} disabled class="is-fueler-on-break"{% endif %}>{{ fueler.display_name }}{% if fueler.id in nightly_on_break_fueler_ids %} (ON BREAK){% elif fueler.id == recommended_fueler_id|default(none) %} (SPEAR Recommended){% endif %}</option>{% endfor %}
