<div class="neoscorpion-fuel-tank-row neoscorpion-fuel-tank-head" role="row">
    <span role="columnheader">Tank</span><span role="columnheader">Remaining</span>
    <span role="columnheader">Planned</span><span role="columnheader">Actual</span>
</div>
{% for tank in row.tank_rows %}
<div class="neoscorpion-fuel-tank-row" role="row" data-tank-code="{{ tank.code }}">
    <strong role="rowheader">{{ tank.label }}</strong>
    <span role="cell">{{ tank.remaining_display or '-' }}</span>
    <span class="neoscorpion-planned-value" role="cell">{{ tank.planned_display or '-' }}</span>
    <span role="cell">{{ tank.actual_display or '-' }}</span>
</div>
{% endfor %}
