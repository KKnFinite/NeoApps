<header class="operational-mobile-header" data-operational-mobile-header>
    <a class="operational-mobile-identity" href="{{ url_for(node_home_endpoint) }}" aria-label="{{ node_header_name }} home">
        <img src="{{ url_for('static', filename=node_header_logo) }}" alt="" width="34" height="34" decoding="async">
        <span><strong>{{ node_header_name }}</strong><small>{{ node_current_label }}</small></span>
    </a>
    <div class="operational-mobile-actions">
        {% if my_alert_tray %}{% include "_my_alert_tray.html" %}{% endif %}
    </div>
</header>
{% if operational_shell_supports_board_view %}<button class="operational-board-exit" type="button" data-operational-board-toggle hidden aria-label="Exit Board View">☰</button>{% endif %}
