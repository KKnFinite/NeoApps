{% if operation_refresh_status %}
{% set operation_refresh_reload = true %}
{% include "neonodes/_operation_refresh_banner.html" %}
{% if operation_refresh_status.auto_refresh_enabled %}
<script>
(() => {
    const root = document.currentScript.previousElementSibling;
    if (!root || !root.matches("[data-operation-refresh-reload]")) {
        return;
    }

    const statusElement = document.querySelector("[data-live-update-status]");
    const controller = window.NeoLiveUpdates.create({
        intervalMs: {{ live_screen_refresh_interval_ms }},
        statusElement,
        immediate: false,
        poll: () => window.location.reload(),
    });
    controller.setServerStatus({
        auto_refresh_enabled: root.dataset.refreshActive === "true",
        reason: {{ operation_refresh_status.reason|tojson }},
        live_status_label: {{ operation_refresh_status.live_status_label|tojson }},
    });
})();
</script>
{% endif %}
{% endif %}
