{% macro pretreat_editor(row) %}<div class="neosubzero-editor" data-completed="{{ 'true' if row.completed else 'false' }}">
{% if can_edit %}<form method="post" action="{{ url_for('neosubzero.pretreat_mutate') }}"><input type="hidden" name="mission_id" value="{{ row.mission_id }}"><input type="hidden" name="operation_id" value="{{ operation.id }}"><input type="hidden" name="physical_tail" value="{{ row.tail }}"><input type="hidden" name="expected_version" value="{{ row.version }}"><button name="action" value="toggle_planned">{{ 'UNPLAN' if row.planned else 'PRETREAT PLANNED' }}</button><button name="action" value="toggle_configured">{{ 'CLEAR CONFIGURED' if row.configured else 'CONFIGURED' }}</button></form>{% endif %}
<form method="post" action="{{ url_for('neosubzero.pretreat_mutate') }}" class="neosubzero-treatment-form"><input type="hidden" name="mission_id" value="{{ row.mission_id }}"><input type="hidden" name="operation_id" value="{{ operation.id }}"><input type="hidden" name="physical_tail" value="{{ row.tail }}"><input type="hidden" name="expected_version" value="{{ row.version }}"><input type="hidden" name="action" value="save_treatment">
<fieldset class="neosubzero-pass type-i"><legend>PASS 1 · TYPE I</legend><label>Surface Area<select name="pass1_surface_area" {% if not can_edit or row.completed %}disabled{% endif %}>{% for value,label in surface_labels.items() %}<option value="{{ value }}" {% if row.state and row.state.pass1_surface_area == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Start<input name="pass1_start" value="{{ row.pass1_start }}" inputmode="numeric" maxlength="5" placeholder="HH:MM" data-clock-time {% if not can_edit or row.completed %}readonly{% endif %}><button type="button" data-subzero-stamp="pass1_start" {% if not can_edit or row.completed %}hidden{% endif %}>NOW</button></label><label>End<input name="pass1_end" value="{{ row.pass1_end }}" inputmode="numeric" maxlength="5" placeholder="HH:MM" data-clock-time {% if not can_edit or row.completed or not row.pass1_start %}readonly{% endif %}><button type="button" data-subzero-stamp="pass1_end" {% if not can_edit or row.completed or not row.pass1_start %}hidden{% endif %}>NOW</button></label></fieldset>
<fieldset class="neosubzero-pass type-iv"><legend>PASS 2 · TYPE IV</legend><label>Surface Area<select name="pass2_surface_area" {% if not can_edit or row.completed %}disabled{% endif %}>{% for value,label in surface_labels.items() %}<option value="{{ value }}" {% if row.state and row.state.pass2_surface_area == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Start<input name="pass2_start" value="{{ row.pass2_start }}" inputmode="numeric" maxlength="5" placeholder="HH:MM" data-clock-time {% if not can_edit or row.completed or not row.pass1_end %}readonly{% endif %}><button type="button" data-subzero-stamp="pass2_start" {% if not can_edit or row.completed or not row.pass1_end %}hidden{% endif %}>NOW</button></label><label>End<input name="pass2_end" value="{{ row.pass2_end }}" inputmode="numeric" maxlength="5" placeholder="HH:MM" data-clock-time {% if not can_edit or row.completed or not row.pass2_start %}readonly{% endif %}><button type="button" data-subzero-stamp="pass2_end" {% if not can_edit or row.completed or not row.pass2_start %}hidden{% endif %}>NOW</button></label></fieldset>
<label>Reason for Application<input name="reason_for_application" maxlength="120" value="{{ row.reason_for_application }}" placeholder="Pretreat" {% if not can_edit or row.completed %}readonly{% endif %}></label>
<label>Notes<textarea name="notes" {% if not can_edit or row.completed %}readonly{% endif %}>{{ (row.state.notes or '') if row.state else '' }}</textarea></label>{% if can_edit and row.completed %}<label>Correction reason<input name="correction_reason" maxlength="2000" required></label>{% endif %}{% if can_edit %}<button type="button" data-subzero-edit {% if not row.completed %}hidden{% endif %}>EDIT</button><button type="submit" {% if row.completed %}hidden{% endif %}>SAVE TREATMENT</button>{% endif %}</form></div>{% endmacro %}
