{% extends "base.html" %}
{% block title %}Settings | NeoSub-Zero{% endblock %}
{% block content %}
<section class="neosubzero-shell">
    <header class="neosubzero-head">
        <div><p>NEOSUB-ZERO</p><h1>SETTINGS</h1></div>
    </header>
    {% include "neonodes/neosubzero/_nav.html" %}

    <section class="neosubzero-settings" aria-labelledby="subzero-fluid-settings">
        <h2 id="subzero-fluid-settings">DEICE FLUIDS</h2>
        <form method="post" class="neosubzero-settings-grid">
            <input type="hidden" name="action" value="save_fluids">
            <label>Type I Fluid Name
                <input name="type_i_fluid_name" maxlength="80" value="{{ fluid_settings.type_i_fluid_name }}" {% if not can_edit %}readonly{% endif %}>
            </label>
            <label>Type I Concentration %
                <input name="type_i_concentration_percent" type="number" min="1" max="100" value="{{ fluid_settings.type_i_concentration_percent }}" {% if not can_edit %}readonly{% endif %}>
            </label>
            <label>Type IV Fluid Name
                <input name="type_iv_fluid_name" maxlength="80" value="{{ fluid_settings.type_iv_fluid_name }}" {% if not can_edit %}readonly{% endif %}>
            </label>
            <p>Type IV is always treated and read back as 100%.</p>
            {% if can_edit %}<button type="submit">SAVE FLUIDS</button>{% endif %}
        </form>
    </section>

</section>
{% endblock %}
