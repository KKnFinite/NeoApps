{% extends "base.html" %}{% block title %}Settings | NeoSub-Zero{% endblock %}{% block content %}<section class="neosubzero-shell"><header class="neosubzero-head"><div><p>NEOSUB-ZERO</p><h1>SETTINGS</h1></div></header><nav class="neosubzero-nav"><a href="{{ url_for('neosubzero.pretreat') }}">PRETREAT</a><a class="active" href="{{ url_for('neosubzero.settings') }}">SETTINGS</a></nav><section class="neosubzero-settings"><h2>LIVE AUTO-REFRESH</h2><form method="post"><label>Pretreat<select name="refresh_interval_seconds" {% if not can_edit %}disabled{% endif %}><option value="default" {% if refresh_setting.override_seconds is none %}selected{% endif %}>Render default</option>{% for seconds in choices %}<option value="{{ seconds }}" {% if refresh_setting.override_seconds == seconds %}selected{% endif %}>{{ 'OFF' if seconds == 0 else seconds ~ ' seconds' }}</option>{% endfor %}</select></label>{% if can_edit %}<button>SAVE</button>{% endif %}</form><dl><div><dt>Effective</dt><dd>{{ refresh_setting.effective_label }}</dd></div><div><dt>Source</dt><dd>{{ refresh_setting.source_label }}</dd></div></dl></section></section>{% endblock %}
