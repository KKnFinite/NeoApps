{% extends "base.html" %}
{% block content %}<section class="aa-workspace">{% include "auth/accounts/_nav.html" %}<section class="aa-section"><h2>Change not saved</h2><p role="alert">{{ error }}</p>{% if draft %}<details open><summary>Your unsaved entries</summary><dl class="aa-facts">{% for key,value in draft.items() %}<div><dt>{{ key|replace('_',' ')|title }}</dt><dd>{{ value }}</dd></div>{% endfor %}</dl></details>{% endif %}<a class="aa-button" href="{{ url_for('auth.account_profile',user_id=target_user.id) if target_user else url_for('auth.my_account') }}">Review current account</a></section></section>{% endblock %}
