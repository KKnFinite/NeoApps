{% extends "base.html" %}

{% set public_landing = true %}
{% block title %}NeoApps{% endblock %}

{% block content %}
<section class="motherbrain-command public-command portal-login-page" aria-label="NeoApps login">
    <section class="motherbrain-core">
        <picture class="portal-login-hero neo-auth-environment">
            <source media="(max-width: 900px)" srcset="{{ url_for('static', filename='images/hero/neoapps_login_mobile.png') }}" width="941" height="1672">
            <img
                src="{{ url_for('static', filename='images/hero/neoapps_login_desktop.png') }}"
                alt="NeoApps"
                width="1672"
                height="941"
                loading="eager"
                fetchpriority="high"
                decoding="async"
            >
        </picture>

        <form class="command-login-form" method="post" action="{{ url_for('auth.login') }}" data-interaction-form>
            <div class="command-login-fields">
                <label for="dashboard-email">Email</label>
                <input id="dashboard-email" name="email" type="email" autocomplete="email" required autofocus>

                <label for="dashboard-password">Password</label>
                <input id="dashboard-password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button class="command-access-panel command-enter-button" type="submit">
                <strong>ENTER</strong>
            </button>
            <div class="command-link-row">
                <a href="{{ url_for('auth.create_account') }}">Create Account</a>
                <a href="{{ url_for('auth.forgot_password') }}">Forgot Password</a>
            </div>
        </form>
    </section>
</section>
{% endblock %}
