{% for item in staffing_screen_items %}
<a class="{{ staffing_nav_class|default('') }}{% if item.active and staffing_nav_class|default('') %} is-active{% endif %}" data-staffing-nav href="{{ url_for(item.endpoint) }}"{% if staffing_nav_role|default('') %} role="{{ staffing_nav_role }}"{% endif %}{% if item.active %} aria-current="page"{% endif %}>
    {% if staffing_nav_class|default('') %}<span class="operational-side-link-icon" aria-hidden="true">{{ item.label[0] }}</span><span class="operational-side-link-label">{% endif %}
    {{ item.label }}
    {% if item.badge and neostaffing_nav[item.badge] %}<strong class="neostaffing-status-pill is-yellow" aria-label="{{ neostaffing_nav[item.badge] }} {{ 'actionable requests' if item.badge == 'actionable_requests' else 'unread notifications' }}">{{ neostaffing_nav[item.badge] }}</strong>{% endif %}
    {% if staffing_nav_class|default('') %}</span>{% endif %}
</a>
{% endfor %}
