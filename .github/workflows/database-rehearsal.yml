name: Disposable database release rehearsal
on:
  workflow_call:
    inputs:
      previous_live:
        required: true
        type: string
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      boot: ${{ steps.marker.outputs.boot }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check which workflow jobs can request protected environments
        run: ruby tests/database_roles/workflow_isolation.rb
      - name: Confirm the actual pull request event cannot enter release policy
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import os
          from scripts.release.github_gate import validate
          def unexpected_read(path):
              raise AssertionError("Release gate requested provider access on a pull request")
          try:
              validate(os.environ, unexpected_read)
          except ValueError as error:
              assert str(error) == "Use a new manual dispatch of the main release workflow"
          else:
              raise AssertionError("Pull request entered the release path")
          print("GitHub pull request event denied before provider access")
          PY
      - name: Mark this disposable runner
        id: marker
        run: |
          umask 077
          head -c 32 /dev/urandom > "$HOME/.neoapps-rehearsal-canary"
          echo "boot=$(cat /proc/sys/kernel/random/boot_id)" >> "$GITHUB_OUTPUT"
      - name: Install reviewed release dependencies
        run: bash scripts/release/install.sh
      - name: Exercise release authorization and failure paths
        run: "$RUNNER_TEMP/neoapps-release/bin/python -m unittest discover -s tests/database_roles -p test_release_workflow.py"
      - name: Exercise migration, worker replacement, rollback and seven application operations
        env:
          PREVIOUS_LIVE_SHA: ${{ inputs.previous_live || github.event.pull_request.base.sha }}
        run: |
          "$RUNNER_TEMP/neoapps-release/bin/python" tests/database_roles/run_local.py \
            --bin "$(pg_config --bindir)" --previous-live "$PREVIOUS_LIVE_SHA" boundary usage ground_time fluid truck flow unit preferences
      - name: Check independent OS credential custody
        run: sudo /usr/bin/python3 tests/database_roles/credential_custody.py --owner-uid "$(id -u nobody)" --runtime-uid "$(id -u daemon)"

  isolation:
    needs: rehearse
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Propagate failed or skipped rehearsal to the required check
        if: needs.rehearse.result != 'success'
        run: exit 1
      - name: Verify fresh runner cannot see migration-runner fixture
        env:
          MIGRATION_JOB_BOOT: ${{ needs.rehearse.outputs.boot }}
        run: |
          test -n "$MIGRATION_JOB_BOOT"
          test "$(cat /proc/sys/kernel/random/boot_id)" != "$MIGRATION_JOB_BOOT"
          test ! -e "$HOME/.neoapps-rehearsal-canary"
          test -z "${MIGRATION_DATABASE_URL:-}${DATABASE_URL:-}"
