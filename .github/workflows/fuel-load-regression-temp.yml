name: Fuel Load Regression (temporary)
on:
  push:
    branches:
      - fix/scorpion-fuel-load-authority-20261117
jobs:
  fuel-load-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Complete Fuel Dispatch workflow tests
        run: python -m unittest tests.test_neoscorpion_dispatch_workflow
      - name: MotherBrain mission form regressions
        run: |
          python -m unittest \
            tests.test_motherbrain_routes.MotherBrainRoutesTest.test_motherbrain_mission_form_cannot_overwrite_scorpion_fuel_load \
            tests.test_motherbrain_routes.MotherBrainRoutesTest.test_edit_departure_mission_into_arrival_clears_pull_times \
            tests.test_motherbrain_routes.MotherBrainRoutesTest.test_create_manual_departure_mission_with_pull_times
      - name: Dispatch client syntax check
        run: node --check app/static/js/neoscorpion_fuel_dispatch_live.js
      - name: Dispatch client regression
        run: node --test tests/js/neoscorpion_dispatch_workflow.test.js
