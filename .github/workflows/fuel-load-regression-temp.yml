name: Fuel Load Regression (temporary)
on:
  push:
    branches:
      - fix/scorpion-fuel-load-authority-20261117
jobs:
  fuel-load-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fuel Dispatch regression
        run: |
          python -m unittest \
            tests.test_neoscorpion_dispatch_workflow.NeoScorpionDispatchWorkflowTest.test_legacy_precision_can_be_corrected_from_exact_stored_baseline \
            tests.test_neoscorpion_dispatch_workflow.NeoScorpionDispatchWorkflowTest.test_fuel_load_requires_exactly_one_decimal_and_cannot_mutate_on_reject \
            tests.test_neoscorpion_dispatch_workflow.NeoScorpionDispatchWorkflowTest.test_inbound_autosave_uses_exact_stored_baseline_too
      - name: MotherBrain isolation regression
        run: python -m unittest tests.test_motherbrain_routes.MotherBrainRoutesTest.test_motherbrain_mission_form_cannot_overwrite_scorpion_fuel_load
      - name: Dispatch client regression
        run: node --test tests/js/neoscorpion_dispatch_workflow.test.js
