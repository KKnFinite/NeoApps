name: NeoSektor WebP helper materialization

on:
  push:
    branches:
      - neosektor-webp-opt-20260908

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !startsWith(github.event.head_commit.message, '[webp-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact verified asset delta
        run: |
          python -m pip install pillow==12.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          image_dir = Path('app/static/images/neosektor')
          for name in ('dashboard_desktop', 'dashboard_mobile'):
              src = image_dir / f'{name}.png'
              dst = image_dir / f'{name}.webp'
              with Image.open(src) as source:
                  source.load()
                  working = source.convert('RGBA' if 'A' in source.getbands() else 'RGB')
                  kwargs = {'format':'WEBP', 'quality':94, 'method':6, 'exact':True}
                  if source.info.get('icc_profile'):
                      kwargs['icc_profile'] = source.info['icc_profile']
                  if source.info.get('exif'):
                      kwargs['exif'] = source.info['exif']
                  working.save(dst, **kwargs)

          template = Path('app/templates/neonodes/neosektor/index.html')
          text = template.read_text(encoding='utf-8')
          assert text.count('images/neosektor/dashboard_mobile.png') == 1
          assert text.count('images/neosektor/dashboard_desktop.png') == 1
          template.write_text(
              text.replace('images/neosektor/dashboard_mobile.png', 'images/neosektor/dashboard_mobile.webp')
                  .replace('images/neosektor/dashboard_desktop.png', 'images/neosektor/dashboard_desktop.webp'),
              encoding='utf-8',
          )

          test = Path('tests/browser/test_sektor_dashboard.py')
          text = test.read_text(encoding='utf-8')
          assert text.count('dashboard_mobile.png') == 1
          assert text.count('dashboard_desktop.png') == 1
          test.write_text(
              text.replace('dashboard_mobile.png', 'dashboard_mobile.webp')
                  .replace('dashboard_desktop.png', 'dashboard_desktop.webp'),
              encoding='utf-8',
          )
          PY
          test "$(stat -c %s app/static/images/neosektor/dashboard_desktop.webp)" = "299204"
          test "$(stat -c %s app/static/images/neosektor/dashboard_mobile.webp)" = "298850"
          git diff --check

      - name: Commit helper blobs
        run: |
          git config user.name "KKnFinite"
          git config user.email "kknfinite@gmail.com"
          git add app/static/images/neosektor/dashboard_desktop.webp \
                  app/static/images/neosektor/dashboard_mobile.webp \
                  app/templates/neonodes/neosektor/index.html \
                  tests/browser/test_sektor_dashboard.py
          git commit -m "[webp-materialized] Optimize NeoSektor dashboard hero assets"
          git push origin HEAD:neosektor-webp-opt-20260908
          git status --short
