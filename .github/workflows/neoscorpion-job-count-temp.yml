name: NeoScorpion Physical Job Count (temporary)
on:
  push:
    branches:
      - fix/scorpion-physical-job-count-20261117
jobs:
  physical-job-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests for physical jobs and resource PROF
        run: python -m unittest tests.test_neoscorpion_resource_prof
      - name: Canonical workflow and historical PROF integration
        run: python -m unittest tests.test_neoscorpion_resource_prof_integration
      - name: SPEAR learning and calibration regression
        run: python -m unittest tests.test_neoscorpion_spear_calibration
